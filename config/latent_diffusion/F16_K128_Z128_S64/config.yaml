# lightning.pytorch==2.5.1
seed_everything: 42
trainer:
  accelerator: auto
  strategy: ddp_find_unused_parameters_true
  devices: auto
  num_nodes: 1
  precision: 16-mixed
  logger:
  - class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: ./models
      name: F16_K128_Z128_S64
      version: null
      log_graph: true
      default_hp_metric: true
      prefix: ''
      sub_dir: null
      comment: ''
      purge_step: null
      max_queue: 10
      flush_secs: 120
      filename_suffix: ''
  callbacks: null
  fast_dev_run: false
  max_epochs: null
  min_epochs: null
  max_steps: 1100005
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: 2500
  check_val_every_n_epoch: null
  num_sanity_val_steps: null
  log_every_n_steps: null
  enable_checkpointing: true
  enable_progress_bar: true
  enable_model_summary: false
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: norm
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
  model_registry: null
model:
  class_path: vv.models.latent_diffusion_copy.VQModel
  init_args:
    learning_rate: 4.5e-06
    ddconfig:
      double_z: false
      z_channels: 256
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult:
      - 1
      - 1
      - 2
      - 2
      - 4
      num_res_blocks: 2
      attn_resolutions:
      - 16
      dropout: 0.0
    lossconfig:
      target: vv.models.latent_diffusion_copy.loss.VQLPIPSWithDiscriminator
      params:
        disc_conditional: false
        disc_in_channels: 3
        disc_num_layers: 3
        disc_start: 1
        disc_weight: 0.8
        codebook_weight: 1.0
    n_embed: 128
    embed_dim: 128
    ckpt_path: null
    ignore_keys: []
    image_key: image
    colorize_nlabels: null
    monitor: val/rec_loss
    batch_resize_range: null
    scheduler_config: null
    lr_g_factor: 1.0
    remap: null
    sane_index_shape: false
    use_ema: false
    split_quantizer: true
    num_spaces: 64
    distance_type: l2
data:
  class_path: vv.data.ImageNetLoader
  init_args:
    resolution: 256
    train_instances: 1281167
    val_instances: 5000
    test_instances: 100000
    batch_size: 30
    workers: 32
    verbose: false
    data_dir: /path/to/imageNet
early_stopping:
  monitor: val/total_loss
  min_delta: 0.0
  patience: 40
  verbose: false
  mode: min
  strict: true
  check_finite: true
  stopping_threshold: null
  divergence_threshold: null
  check_on_train_epoch_end: null
  log_rank_zero_only: false
lr_monitor:
  logging_interval: step
  log_momentum: false
  log_weight_decay: false
checkpoint:
  dirpath: null
  filename: '{epoch}-{step}-{val/total_loss:.4f}'
  monitor: null
  verbose: false
  save_last: null
  save_top_k: -1
  save_weights_only: false
  mode: min
  auto_insert_metric_name: true
  every_n_train_steps: 100000
  train_time_interval: null
  every_n_epochs: null
  save_on_train_epoch_end: null
  enable_version_counter: true
image_logger:
  num_images: 5
  tag_name: images_in_vs_out
metrics_logger:
  log_every_n_val_epoch: 20
  fid_config:
    feature_layer_size: 2048
  kid_config:
    feature_layer_size: 2048
  is_config:
    feature_layer_size: 2048
    splits: 10
  lpips_config:
    net_type: alex
    reduction: mean
  psnr_config:
    data_range:
    - 0.0
    - 1.0
    base: 10
    reduction: elementwise_mean
    dim: null
verbose_mode: false
optimizer: null
lr_scheduler: null
ckpt_path: null
